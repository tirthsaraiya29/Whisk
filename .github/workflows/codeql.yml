name: "CodeQL Advanced"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "21 20 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: "Analyze (${{ matrix.language }})"
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:

          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@816722acf8fd27c9d1e9ae6ee6085da07e0d44c1 # v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@354d3a23c0a0a30518fc36e7ed533bc072f874f6 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          dependency-caching: true

      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean compileDebugSources

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@354d3a23c0a0a30518fc36e7ed533bc072f874f6 # v4
        with:
          category: "/language:${{ matrix.language }}"
